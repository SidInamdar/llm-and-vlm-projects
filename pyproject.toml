[project]
name = "llm-and-vlm-projects"
version = "0.1.0"
description = "LLM and VLM research monorepo — shared utilities and project experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets==5.0.0",
    "datasketch==1.10.0",
    "datatrove>=0.8.0",
    "fasttext>=0.9.3",
    "lingua-language-detector==2.2.0",
    "matplotlib==3.10.8",
    "mlflow==3.13.0",
    "nltk==3.9.4",
    "peft==0.18.1",
    "tensorboard==2.20.0",
    "torch==2.9.1",
    "transformers==4.57.3",
    "trl==1.5.1",
    "wandb==0.26.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "ipykernel>=6",
]

# Make `shared/` importable as `from shared.xxx import ...`
# when running via `uv run` from the repo root.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["shared/tests"]
